<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VLTR Dual Screen Console</title>
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CARCASA / SKIN DE FONDO */
        #console-wrapper {
            position: relative;
            width: 100vw;
            height: 100dvh;
            max-width: 430px;
            background: url('assets/skin.png') no-repeat center center;
            background-size: contain;
        }

        /* EMULADOR FUENTE (OCULTO EN SEGUNDO PLANO) */
        #emulator-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* --- 1. PANTALLA SUPERIOR SEPARADA --- */
        #top-screen {
            position: absolute;
            top: 3.5%;        /* Posición dentro del marco superior */
            left: 11.5%;
            width: 77%;
            height: 31%;
            background-color: #000;
            border-radius: 4px;
        }

        /* --- 2. PANTALLA INFERIOR TÁCTIL SEPARADA --- */
        #bottom-screen {
            position: absolute;
            top: 40.5%;       /* Posición dentro del marco inferior */
            left: 11.5%;
            width: 77%;
            height: 31%;
            background-color: #000;
            border-radius: 4px;
            touch-action: none;
            cursor: pointer;
        }

        /* --- 3. BOTONES INVISIBLES SOBRE LA CARCASA --- */
        .touch-zone {
            position: absolute;
            z-index: 20;
        }

        /* MODO DEBUG: Descomenta si quieres ver las cajas de los botones en rojo */
        /* .touch-zone { background: rgba(255, 0, 0, 0.3); border: 1px solid red; } */

        #btn-dpad { top: 75%; left: 7%; width: 32%; height: 16%; }
        #btn-a { top: 81%; left: 81%; width: 13%; height: 6.5%; border-radius: 50%; }
        #btn-b { top: 88.5%; left: 72%; width: 13%; height: 6.5%; border-radius: 50%; }
        #btn-x { top: 73.5%; left: 72%; width: 13%; height: 6.5%; border-radius: 50%; }
        #btn-y { top: 81%; left: 63%; width: 13%; height: 6.5%; border-radius: 50%; }

        /* SPLASH SCREEN DE ENCENDIDO */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            background: #000; color: #fff;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <!-- Pantalla de inicio -->
    <div id="splash-screen" onclick="bootCartridge()">
        <h2>VLTR SYSTEM</h2>
        <p style="color:#888;">TOCA PARA ENCENDER</p>
    </div>

    <!-- CARCASA Y PANTALLAS SEPARADAS -->
    <div id="console-wrapper">

        <!-- Pantalla 1: Superior -->
        <canvas id="top-screen" width="256" height="192"></canvas>

        <!-- Pantalla 2: Inferior (Táctil) -->
        <canvas id="bottom-screen" width="256" height="192"></canvas>

        <!-- Botones invisibles sobre la carcasa -->
        <div id="btn-dpad" class="touch-zone"></div>
        <div id="btn-a" class="touch-zone"></div>
        <div id="btn-b" class="touch-zone"></div>
        <div id="btn-x" class="touch-zone"></div>
        <div id="btn-y" class="touch-zone"></div>

    </div>

    <!-- Emulador corriendo oculto en el fondo -->
    <div id="emulator-hidden">
        <div id="game"></div>
    </div>

    <script>
        const topCanvas = document.getElementById('top-screen');
        const bottomCanvas = document.getElementById('bottom-screen');
        const topCtx = topCanvas.getContext('2d');
        const bottomCtx = bottomCanvas.getContext('2d');

        function startScreenSlicing() {
            function renderFrame() {
                // Busca el lienzo que genera el emulador en segundo plano
                const sourceCanvas = document.querySelector('#game canvas');
                
                if (sourceCanvas && sourceCanvas.width > 0) {
                    // Recorta los 256x192 superiores -> Pantalla de Arriba
                    topCtx.drawImage(sourceCanvas, 0, 0, 256, 192, 0, 0, 256, 192);
                    
                    // Recorta los 256x192 inferiores -> Pantalla Táctil
                    bottomCtx.drawImage(sourceCanvas, 0, 192, 256, 192, 0, 0, 256, 192);
                }
                
                requestAnimationFrame(renderFrame);
            }
            renderFrame();
        }

        // REDIRECCIÓN TÁCTIL EXACTA: Al tocar la pantalla inferior visible, manda el toque a la NDS
        bottomCanvas.addEventListener('pointerdown', (e) => {
            const sourceCanvas = document.querySelector('#game canvas');
            if (!sourceCanvas) return;

            const rect = bottomCanvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width * sourceCanvas.width;
            // Sumamos la mitad del alto para apuntar a la pantalla inferior del emulador
            const y = ((e.clientY - rect.top) / rect.height * (sourceCanvas.height / 2)) + (sourceCanvas.height / 2);

            const touchEvent = new MouseEvent('mousedown', {
                clientX: sourceCanvas.getBoundingClientRect().left + x,
                clientY: sourceCanvas.getBoundingClientRect().top + y,
                bubbles: true
            });
            sourceCanvas.dispatchEvent(touchEvent);
        });

        function bootCartridge() {
            document.getElementById('splash-screen').style.display = 'none';

            window.EJS_player = '#game';
            window.EJS_core = 'nds';
            window.EJS_gameName = 'VLTR Core';
            window.EJS_color = '#000000';
            window.EJS_startOnLoaded = true;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_gameUrl = 'roms/sys_data_01.dat';
            window.EJS_defaultMenu = false;

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            script.onload = () => {
                // Inicia la división de pantallas una vez cargado el motor
                setTimeout(startScreenSlicing, 1000);
            };
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
