<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web System Core</title>
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            touch-action: none;
        }
        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* --- 1. ÁREA DE PANTALLAS NDS (55% SUPERIOR) --- */
        #game canvas {
            max-height: 55vh !important;
            width: 100vw !important;
            object-fit: contain !important;
            position: absolute !important;
            top: 1vh !important;
            left: 0 !important;
            pointer-events: auto !important; /* Habilita el toque directo como Stylus */
            touch-action: none !important;
            image-rendering: pixelated !important;
            z-index: 10 !important;
        }

        /* --- 2. OCULTAR MENÚS SECUNDARIOS --- */
        #ejs-menu, .ejs-footer, .ejs-header {
            display: none !important;
        }

        /* --- 3. ÁREA DE BOTONES (45% INFERIOR - SIN TRASLAPE) --- */
        #ejs-controls, #ejs-buttons {
            pointer-events: none !important;
            z-index: 20 !important;
        }

        /* Habilitar interacción solo en los botones físicos */
        #ejs-buttons button, #ejs-dpad, #ejs-abxy {
            pointer-events: auto !important;
            background: rgba(255, 255, 255, 0.15) !important;
            border: 2px solid rgba(255, 255, 255, 0.4) !important;
            border-radius: 50% !important;
            color: #fff !important;
        }

        /* Posición de la Cruceta */
        #ejs-dpad {
            position: absolute !important;
            left: 5vw !important;
            bottom: 7vh !important;
            transform: scale(1.1) !important;
        }

        /* Posición de los botones A, B, X, Y */
        #ejs-abxy {
            position: absolute !important;
            right: 5vw !important;
            bottom: 7vh !important;
            transform: scale(1.1) !important;
        }

        /* Posición de L y R (Justo debajo de la pantalla inferior) */
        #EJS_NDS_L { 
            position: absolute !important; 
            left: 5vw !important; 
            top: 57vh !important; 
            bottom: auto !important; 
        }
        #EJS_NDS_R { 
            position: absolute !important; 
            right: 5vw !important; 
            top: 57vh !important; 
            bottom: auto !important; 
        }

        /* Posición de Start y Select */
        #EJS_NDS_START { 
            position: absolute !important; 
            left: 36vw !important; 
            bottom: 3vh !important; 
            transform: scale(0.85) !important;
        }
        #EJS_NDS_SELECT { 
            position: absolute !important; 
            left: 52vw !important; 
            bottom: 3vh !important; 
            transform: scale(0.85) !important;
        }
    </style>
</head>
<body>

    <div id="game"></div>

    <script>
        EJS_player = '#game';
        EJS_core = 'nds';
        EJS_gameName = 'System Core';
        EJS_color = '#151515';
        EJS_startOnLoaded = true;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_gameUrl = 'roms/sys_data_01.dat';
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
